services:
  - type: web
    name: kintsugi-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: sh -c "alembic -c alembic.ini upgrade head && uvicorn kintsugi.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers"
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kintsugi-db
          property: connectionString
      - key: KINTSUGI_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /data
      - key: WEB_ORIGINS
        value: https://kintsugi-nu.vercel.app
      - key: SECURE_COOKIE
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: FIREBASE_PROJECT_ID
        value: kintsugi-dea6b
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_WEB_APP_ID
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        value: kintsugi-dea6b.firebaseapp.com
      - key: FIRESTORE_ENABLED
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2.5-sunburst
      - key: DAMAGE_ANALYSIS_PROVIDER
        value: auto
      - key: REPAIR_PREVIEW_PROVIDER
        value: auto
      - key: SEGMENTATION_MODEL
        value: grabcut
      - key: WORKER_JOB_KINDS
        value: analyze,compile,preview
    disk:
      name: kintsugi-data
      mountPath: /data
      sizeGB: 10

  - type: worker
    name: kintsugi-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: sh -c "alembic -c alembic.ini upgrade head && python -m kintsugi.worker"
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kintsugi-db
          property: connectionString
      - key: KINTSUGI_SECRET
        fromService:
          type: web
          name: kintsugi-api
          envVarKey: KINTSUGI_SECRET
      - key: DATA_DIR
        value: /data
      - key: FIREBASE_PROJECT_ID
        value: kintsugi-dea6b
      - key: FIRESTORE_ENABLED
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2.5-sunburst
      - key: DAMAGE_ANALYSIS_PROVIDER
        value: auto
      - key: REPAIR_PREVIEW_PROVIDER
        value: auto
      - key: SEGMENTATION_MODEL
        value: grabcut
      - key: WORKER_JOB_KINDS
        value: analyze,compile,preview
    disk:
      name: kintsugi-worker-data
      mountPath: /data
      sizeGB: 10

databases:
  - name: kintsugi-db
    plan: free
